apiVersion: v1
kind: Service
metadata:
  name: chimneysweep
  namespace: village
  labels:
    listed-in: village
  annotations:
    description: "The chimneysweep is up on the roof, sweeping the chimney"
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    run: poster-on-the-chimney
  type: ClusterIP
