apiVersion: v1
kind: Pod
metadata:
  name: poster-on-the-chimney
  namespace: village
  labels:
    run: poster-on-the-chimney
spec:
  initContainers:
  - name: cluelogger
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        echo "The poster is too high up on the chimney, wouldn't it be cool if somebody could get there and read it?" >> /dev/stderr;
        # Sleep for a short time to ensure the logs are written
        sleep 5
    resources: {}
  containers:
  - name: poster
    image: nginx
    imagePullPolicy: Always
    ports:
      - containerPort: 80
    command:
      - /bin/sh
      - -c
      - |
        echo 'Chimneysweep shouting from the roof: The message reads: Welcome to the village. Enjoy your stay. Call wizard on his phone if you want to visit him.' > /usr/share/nginx/html/index.html;
        nginx -g 'daemon off;' 
