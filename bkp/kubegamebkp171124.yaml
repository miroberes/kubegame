      - /bin/sh
      - -c
      - "echo 'Chimneysweep shouting from the roof: The message reads: Welcome to
        the village. Enjoy your stay. Call wizard on his phone if you want to visit
        him.' > /usr/share/nginx/html/index.html;\nnginx -g 'daemon off;' \n"
