apiVersion: v1
kind: Pod
metadata:
  name: gate
  namespace: default
spec:
  serviceAccountName: gate
  containers:
  - command:
    - /bin/sh
    - -c
    - |-
      echo 'To open you need to -whisper- the magic key phrase.
      It is, pssst... under the doormat.' > /dev/stderr; sleep infinity
    image: busybox
    imagePullPolicy: IfNotPresent
    name: cluelogger
    volumeMounts:
    - mountPath: /scripts
      name: script-volume
    - mountPath: /tools
      name: tools-volume
  initContainers:
  - command:
    - /bin/sh
    - -c
    - cp -L /bin/kubectl /tools/kubectl && chmod 0755 /tools/kubectl
    image: rancher/k3s:v1.33.4-k3s1
    imagePullPolicy: IfNotPresent
    name: copy-kubectl
    volumeMounts:
    - mountPath: /tools
      name: tools-volume
  - args:
    - |
      cat > /scripts/check_phrase.sh <<'SCRIPT'
      #!/bin/sh
      SECRET_PHRASE="openplease"
      echo $1
      if [ "$1" = "$SECRET_PHRASE" ]; then
        /tools/kubectl patch configmap kingdom-state -n default --type merge -p '{"data":{"act":"2"}}' >/dev/null || { echo "The gate does not open. Try again later."; exit 1; }
        if ! /tools/kubectl get rolebinding player-binder -n village >/dev/null 2>&1; then
          /tools/kubectl create rolebinding player-binder --role=act2-binder --serviceaccount=default:player -n village >/dev/null || { echo "The gate does not open. Try again later."; exit 1; }
        fi
        echo "Correct magic key phrase! You may proceed to the village. Use the command: enter village"
      else
        echo "Incorrect magic key phrase. Try again."
      fi
      SCRIPT
      chmod +x /scripts/check_phrase.sh
    command:
    - /bin/sh
    - -c
    image: busybox
    imagePullPolicy: IfNotPresent
    name: init-script
    volumeMounts:
    - mountPath: /scripts
      name: script-volume
  restartPolicy: Always
  volumes:
  - emptyDir: {}
    name: script-volume
  - emptyDir: {}
    name: tools-volume
