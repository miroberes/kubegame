apiVersion: v1
kind: Pod
metadata:
  name: gate
  namespace: default
spec:
  containers:
  - command:
    - /bin/sh
    - -c
    - |-
      echo 'To open you need to -whisper- the magic key phrase.
      It is, pssst... under the doormat.' > /dev/stderr; sleep infinity
    image: busybox
    imagePullPolicy: Always
    name: cluelogger
    volumeMounts:
    - mountPath: /scripts
      name: script-volume
  initContainers:
  - args:
    - |
      echo '#!/bin/sh' > /scripts/check_phrase.sh;
      echo 'SECRET_PHRASE="openplease"' >> /scripts/check_phrase.sh;
      echo 'echo $1' >> /scripts/check_phrase.sh;
      echo 'if [ "$1" = "$SECRET_PHRASE" ]; then' >> /scripts/check_phrase.sh;
      echo '  echo "Correct magic key phrase! You may proceed to the village. Use the spell: enter village"' >> /scripts/check_phrase.sh;
      echo 'else' >> /scripts/check_phrase.sh;
      echo '  echo "Incorrect magic key phrase. Try again."' >> /scripts/check_phrase.sh;
      echo 'fi' >> /scripts/check_phrase.sh;
      chmod +x /scripts/check_phrase.sh
    command:
    - /bin/sh
    - -c
    image: busybox
    imagePullPolicy: Always
    name: init-script
    volumeMounts:
    - mountPath: /scripts
      name: script-volume
  restartPolicy: Always
  volumes:
  - emptyDir: {}
    name: script-volume
