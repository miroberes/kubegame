apiVersion: v1
kind: Pod
metadata:
  name: gate
  namespace: default
  labels:
    listed-in: default
spec:
  serviceAccountName: gate
  containers:
  - command:
    - /bin/sh
    - -c
    - |-
      echo 'You approached the gate, stumbling over a doormat. The gate has gold letters k8s written on it. There is no doorknob.' > /dev/stderr; sleep infinity
    image: busybox
    imagePullPolicy: IfNotPresent
    name: cluelogger
    volumeMounts:
    - mountPath: /scripts
      name: script-volume
    - mountPath: /tools
      name: tools-volume
    - mountPath: /doormat
      name: doormat-volume
      readOnly: true
  initContainers:
  - command:
    - /bin/sh
    - -c
    - cp -L /bin/kubectl /tools/kubectl && chmod 0755 /tools/kubectl
    image: rancher/k3s:v1.33.4-k3s1
    imagePullPolicy: IfNotPresent
    name: copy-kubectl
    volumeMounts:
    - mountPath: /tools
      name: tools-volume
  - args:
    - |
      cat > /scripts/check_phrase.sh <<'SCRIPT'
      #!/bin/sh
      SECRET_PHRASE=$(cat /doormat/magic-key-phrase)
      if [ "$1" = "$SECRET_PHRASE" ]; then
        echo "Correct magic key phrase! The gate opens and you see the village expecting you to enter."
      else
        echo "Incorrect magic key phrase. Try again."
        exit 1
      fi
      SCRIPT
      chmod +x /scripts/check_phrase.sh
    command:
    - /bin/sh
    - -c
    image: busybox
    imagePullPolicy: IfNotPresent
    name: init-script
    volumeMounts:
    - mountPath: /scripts
      name: script-volume
  restartPolicy: Always
  volumes:
  - emptyDir: {}
    name: script-volume
  - emptyDir: {}
    name: tools-volume
  - configMap:
      name: doormat
    name: doormat-volume
