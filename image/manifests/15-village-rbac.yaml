apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: act2-player
  namespace: village
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player", "poster-on-the-chimney"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/log"]
  resourceNames: ["poster-on-the-chimney"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  resourceNames: ["player"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gate-village
  namespace: village
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  resourceNames: ["act2-player"]
  verbs: ["get"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: ["act2-player"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gate-village
  namespace: village
subjects:
- kind: ServiceAccount
  name: gate
  namespace: default
roleRef:
  kind: Role
  name: gate-village
  apiGroup: rbac.authorization.k8s.io
