apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: act2-player
  namespace: village
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["services"]
  resourceNames: ["chimneysweep"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["endpoints"]
  resourceNames: ["chimneysweep"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player-pod", "chimneysweep", "k8s-spellkeeper-pod"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/log"]
  resourceNames: ["chimneysweep"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  resourceNames: ["player-pod", "k8s-spellkeeper-pod"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player-pod", "k8s-spellkeeper-pod"]
  verbs: ["delete", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["k8s-spellkeeper-pod"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["book"]
  verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gate-village
  namespace: village
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  resourceNames: ["act2-player"]
  verbs: ["get"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: ["act2-player"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gate-village
  namespace: village
subjects:
- kind: ServiceAccount
  name: gate
  namespace: default
roleRef:
  kind: Role
  name: gate-village
  apiGroup: rbac.authorization.k8s.io
