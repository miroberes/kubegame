apiVersion: v1
kind: ConfigMap
metadata:
  name: telephone-phone-config
  namespace: telephone-booth
data:
  default.conf: |
    server {
      listen 8081;
      server_name localhost;

      location / {
        proxy_pass http://wizards-phone.wizardshouse:8081;
      }
    }
    server {
      listen 8080;
      server_name localhost;

      location / {
        return 200 "Hello, this is the telephone booth. If you wait long enough, maybe somebody answers the call, but i would not bet on it...\n";
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: booth-telephone-pod
  namespace: telephone-booth
  labels:
    app: telephone-phone
spec:
  containers:
  - name: phone
    image: nginx
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8081
      protocol: TCP
    - containerPort: 8080
      protocol: TCP
    volumeMounts:
    - mountPath: /etc/nginx/conf.d
      name: nginx-config
  volumes:
  - name: nginx-config
    configMap:
      name: telephone-phone-config
