apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kingdom-state-reader
  namespace: kingdom-state
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["kingdom-state"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kingdom-state-reader
  namespace: kingdom-state
subjects:
- kind: ServiceAccount
  name: player
  namespace: default
roleRef:
  kind: Role
  name: kingdom-state-reader
  apiGroup: rbac.authorization.k8s.io
