apiVersion: v1
kind: Pod
metadata:
  labels:
    app: telephone-operator
    listed-in: telephone-booth
  name: telephone-operator
  namespace: telephone-booth
spec:
  containers:
  - image: nginx
    imagePullPolicy: IfNotPresent
    name: wizardsphone
    ports:
    - containerPort: 8081
      protocol: TCP
    volumeMounts:
    - mountPath: /usr/share/nginx/html
      name: wizardsmessage
    - mountPath: /etc/nginx/conf.d
      name: nginx-config-wizardsphone
  - image: nginx
    imagePullPolicy: IfNotPresent
    name: toothfairyphone
    ports:
    - containerPort: 8082
      protocol: TCP
    volumeMounts:
    - mountPath: /usr/share/nginx/html
      name: toothfairymessage
    - mountPath: /etc/nginx/conf.d
      name: nginx-config-toothfairyphone
  restartPolicy: Always
  volumes:
  - configMap:
      defaultMode: 420
      name: wizardsmessage
    name: wizardsmessage
  - configMap:
      defaultMode: 420
      name: toothfairymessage
    name: toothfairymessage
  - configMap:
      defaultMode: 420
      name: nginx-config-wizardsphone
    name: nginx-config-wizardsphone
  - configMap:
      defaultMode: 420
      name: nginx-config-toothfairyphone
    name: nginx-config-toothfairyphone
