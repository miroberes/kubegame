apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booth-player
  namespace: telephone-booth
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  resourceNames: ["telephone"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player-pod", "telephone-operator", "telephone-book"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/log"]
  resourceNames: ["telephone-book"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  resourceNames: ["player-pod"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booth-player
  namespace: telephone-booth
subjects:
- kind: ServiceAccount
  name: player
  namespace: default
roleRef:
  kind: Role
  name: booth-player
  apiGroup: rbac.authorization.k8s.io
