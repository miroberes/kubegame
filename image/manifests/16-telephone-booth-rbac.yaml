apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booth-player
  namespace: telephone-booth
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booth-player
  namespace: telephone-booth
subjects:
- kind: ServiceAccount
  name: player
  namespace: default
roleRef:
  kind: Role
  name: booth-player
  apiGroup: rbac.authorization.k8s.io
