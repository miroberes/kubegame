apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booth-player
  namespace: telephone-booth
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  resourceNames: ["booth-telephone"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player-pod", "telephone-book", "k8s-spellkeeper-pod"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/log"]
  resourceNames: ["telephone-book"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  resourceNames: ["player-pod", "k8s-spellkeeper-pod"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player-pod", "k8s-spellkeeper-pod"]
  verbs: ["delete", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["k8s-spellkeeper-pod"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["book"]
  verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booth-player
  namespace: telephone-booth
subjects:
- kind: ServiceAccount
  name: player
  namespace: default
roleRef:
  kind: Role
  name: booth-player
  apiGroup: rbac.authorization.k8s.io
