apiVersion: v1
kind: Pod
metadata:
  name: postit-pod
  namespace: wizardshouse
  labels:
    listed-in: wizardshouse
spec:
  containers:
  - name: cluelogger
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        echo "From here there is no way back. Speak this and you will be unmade, then made again, with the Book of k8s spells in your hands. Great power lives in its pages. Beware of it.  kubectl apply -f ~/...yaml" >> /dev/stderr;
        sleep infinity
