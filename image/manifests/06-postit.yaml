apiVersion: v1
kind: Pod
metadata:
  name: postit-pod
  namespace: wizardshouse
  labels:
    listed-in: wizardshouse
spec:
  containers:
  - name: cluelogger
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        echo "Beware, from here there is no way back. Speak this and you will be unmade, then made again, with the Book of k8s spells forever yours. Great power lives in its pages." >> /dev/stderr;
        echo "" >> /dev/stderr;
        echo "kubectl apply -f ~/...yaml" >> /dev/stderr;
        echo "" >> /dev/stderr;
        echo "then:" >> /dev/stderr;
        echo "kubectl delete pod player-pod" >> /dev/stderr;
        sleep infinity
