apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wizards-phone-memory
  namespace: wizardshouse
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wizards-phone-message
  namespace: wizardshouse
data:
  message: |
    #!/bin/sh
    echo "Content-Type: text/plain"
    echo
    if [ "$REQUEST_METHOD" = POST ]; then
      head -c "${CONTENT_LENGTH:-0}" > /data/name
      echo "Thank you, I will remember your name. Use it to enter my house."
    elif [ -s /data/name ]; then
      echo "I remember: $(cat /data/name)"
    else
      echo "Hello, this is the Wizard. Leave a message with your name."
    fi
---
apiVersion: v1
kind: Pod
metadata:
  name: wizards-phone
  namespace: wizardshouse
  labels:
    run: wizards-phone
    listed-in: wizardshouse
spec:
  containers:
  - name: wizardsphone
    image: busybox
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8081
      protocol: TCP
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /www/cgi-bin
        echo 'Hello, this is the Wizard. Leave a message with your name.' > /www/index.html
        cp /cgi/message /www/cgi-bin/message
        chmod 755 /www/cgi-bin/message
        exec httpd -f -p 8081 -h /www
    volumeMounts:
    - mountPath: /cgi
      name: message
    - mountPath: /data
      name: memory
  volumes:
  - name: message
    configMap:
      name: wizards-phone-message
      defaultMode: 493
  - name: memory
    persistentVolumeClaim:
      claimName: wizards-phone-memory
---
apiVersion: v1
kind: Service
metadata:
  name: wizards-phone
  namespace: wizardshouse
  labels:
    listed-in: wizardshouse
spec:
  ports:
  - name: wizardsphone
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    run: wizards-phone
  type: ClusterIP
