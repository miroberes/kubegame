apiVersion: v1
kind: ServiceAccount
metadata:
  name: wizard-phone
  namespace: wizardshouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: visitor-grant
  namespace: wizardshouse
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: ["wizardshouse-visitor"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: visitor-grant
  namespace: wizardshouse
subjects:
- kind: ServiceAccount
  name: wizard-phone
  namespace: wizardshouse
roleRef:
  kind: Role
  name: visitor-grant
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wizardshouse-visitor
  namespace: wizardshouse
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  resourceNames: ["wizards-phone"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player-pod"]
  verbs: ["get", "delete", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["k8s-spellkeeper-pod"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["book"]
  verbs: ["get", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  resourceNames: ["player-pod", "k8s-spellkeeper-pod"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/log"]
  resourceNames: ["bookshelf-pod", "postit-pod"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["bookshelf-pod", "postit-pod"]
  verbs: ["get"]
