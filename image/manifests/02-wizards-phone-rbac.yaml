apiVersion: v1
kind: ServiceAccount
metadata:
  name: wizard-phone
  namespace: wizardshouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: visitor-grant
  namespace: wizardshouse
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: ["wizardshouse-visitor"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: visitor-grant
  namespace: wizardshouse
subjects:
- kind: ServiceAccount
  name: wizard-phone
  namespace: wizardshouse
roleRef:
  kind: Role
  name: visitor-grant
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wizardshouse-visitor
  namespace: wizardshouse
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["player-pod"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  resourceNames: ["player-pod"]
  verbs: ["create"]
