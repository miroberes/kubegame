apiVersion: v1
kind: ServiceAccount
metadata:
  name: gate
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gate-unlock
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["kingdom-state"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gate-unlock
  namespace: default
subjects:
- kind: ServiceAccount
  name: gate
  namespace: default
roleRef:
  kind: Role
  name: gate-unlock
  apiGroup: rbac.authorization.k8s.io
