apiVersion: v1
kind: Service
metadata:
  name: booth-telephone
  namespace: telephone-booth
  labels:
    listed-in: telephone-booth
  annotations:
    description: "A telephone hangs on the wall of the booth. To call someone, use -dial number- from the telephone book."
spec:
  clusterIP: None
  ports:
  - name: wizardsphone
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app: telephone-phone
  type: ClusterIP
