apiVersion: v1
kind: ConfigMap
metadata:
  name: clue-message
  namespace: default
data:
  index.html: |
    look under the doormat
---
apiVersion: v1
kind: Pod
metadata:
  name: clue
  namespace: default
  labels:
    run: clue
spec:
  containers:
  - name: clue
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - mountPath: /usr/share/nginx/html
      name: clue-message
  volumes:
  - name: clue-message
    configMap:
      name: clue-message
---
apiVersion: v1
kind: Service
metadata:
  name: clue
  namespace: default
spec:
  selector:
    run: clue
  ports:
  - port: 80
    targetPort: 80
