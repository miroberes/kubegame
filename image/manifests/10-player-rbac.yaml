apiVersion: v1
kind: ServiceAccount
metadata:
  name: player
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: act1-player
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods"]
  resourceNames: ["gate"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/log"]
  resourceNames: ["gate"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  resourceNames: ["gate"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: act1-player
  namespace: default
subjects:
- kind: ServiceAccount
  name: player
  namespace: default
roleRef:
  kind: Role
  name: act1-player
  apiGroup: rbac.authorization.k8s.io
