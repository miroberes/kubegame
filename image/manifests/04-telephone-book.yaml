apiVersion: v1
kind: Pod
metadata:
  name: telephone-book
  namespace: telephone-booth
  labels:
    run: telephone-book
    listed-in: telephone-booth
spec:
  containers:
  - image: busybox
    name: cluelogger
    command:
      - /bin/sh
      - -c
      - |
        echo "Telephone book of the kingdom. Use -dial- to call. Wizard: dial 8081. Tooth Fairy: dial 8082." >> /dev/stderr;
        sleep infinity
