apiVersion: v1
kind: Pod
metadata:
  name: gate
spec:
  containers:
  - name: main-container
    image: busybox
    command: ["/bin/sh", "-c", "sleep infinity"]
    volumeMounts:
    - name: script-volume
      mountPath: /scripts
  initContainers:
  - name: init-script
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo '#!/bin/sh' > /scripts/check_phrase.sh;
        echo 'SECRET_PHRASE="openplease"' >> /scripts/check_phrase.sh;
        echo 'echo $1' >> /scripts/check_phrase.sh;
        echo 'if [ "$1" = "$SECRET_PHRASE" ]; then' >> /scripts/check_phrase.sh;
        echo '  echo "Correct magic key phrase! You may proceed to the village. Use the spell: sns village"' >> /scripts/check_phrase.sh;
        echo 'else' >> /scripts/check_phrase.sh;
        echo '  echo "Incorrect magic key phrase. Try again."' >> /scripts/check_phrase.sh;
        echo 'fi' >> /scripts/check_phrase.sh;
        chmod +x /scripts/check_phrase.sh
    volumeMounts:
    - name: script-volume
      mountPath: /scripts
  volumes:
  - name: script-volume
    emptyDir: {}

